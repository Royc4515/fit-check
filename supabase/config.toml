# Supabase CLI config. Project ref is set with `supabase link --project-ref <ref>`.
project_id = "ftjerbwrzjprfikxkukj"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081", "fitcheck://auth"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "20MiB"

[functions.intake-separate]
verify_jwt = true
[functions.intake-cutout]
verify_jwt = true
[functions.intake-tag]
verify_jwt = true
[functions.generate-daily]
verify_jwt = false   # invoked by pg_cron with the service role, not by the app
[functions.precheck]
verify_jwt = true
[functions.import-sheet]
verify_jwt = true
[functions.tryon]
verify_jwt = true
# Deployed with their own checks instead of the gateway's JWT check (see each function's header):
[functions.mcp]
verify_jwt = false   # an MCP client sends an OAuth access token; the function verifies it itself and answers 401 + WWW-Authenticate
[functions.design-preview]
verify_jwt = false   # compares a one-time code in constant time; temporary, to be retired
